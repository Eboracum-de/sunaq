# SunaQ capability preset: workgroup
# ERG Internal baseline: SunaQ-owned persistent derived state from the
# authoritative internal Nextcloud information space is allowed. External
# information acquisition (Mail/Web/external resolver/delegated research) is not.
architecture:
  tier: erg_internal
acl:
  enabled: true
retrieval_policy:
  internal:
    files: required
    vector: optional
    graph: disabled
  optional_default: include
  web: disabled
qdrant:
  enabled: true
neo4j:
  enabled: true
resolver:
  enabled: true
sync_worker:
  enabled: true
sync:
  graph_queue:
    enabled: false
graph_queue:
  enabled: false
  auto_enqueue_cited_documents: false
  worker:
    enabled: false
research_findings:
  enabled: true
graph_indexer:
  enabled: false
graph_entity_discovery:
  enabled: false
graph_relation_discovery:
  enabled: false
mail_metadata:
  enabled: false
mail:
  enabled: false
  worker:
    enabled: false
chat_archive:
  enabled: true
