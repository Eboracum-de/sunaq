# SunaQ capability preset: core
# Secure RAG Core (SRC): runtime use of the authoritative Nextcloud/FTS
# information space without SunaQ-owned persistent derived knowledge state or
# external information acquisition. No secrets belong in preset files.
architecture:
  tier: src
acl:
  enabled: true
retrieval_policy:
  internal:
    files: required
    vector: disabled
    graph: disabled
  optional_default: include
  web: disabled
qdrant:
  enabled: false
neo4j:
  enabled: false
resolver:
  enabled: false
sync_worker:
  enabled: false
sync:
  graph_queue:
    enabled: false
graph_queue:
  enabled: false
  auto_enqueue_cited_documents: false
  worker:
    enabled: false
research_findings:
  enabled: false
graph_indexer:
  enabled: false
graph_entity_discovery:
  enabled: false
graph_relation_discovery:
  enabled: false
mail_metadata:
  enabled: false
mail:
  enabled: false
  worker:
    enabled: false
chat_archive:
  enabled: false
