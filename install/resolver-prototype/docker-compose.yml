services:
  resolver:
    image: sunaq-resolver:prototype
    build:
      context: ../..
      dockerfile: install/resolver-prototype/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      RESOLVER_NEO4J_ENABLED: "true"
      RESOLVER_NEO4J_URI: "bolt://127.0.0.1:${NEO4J_BOLT_PORT:-7687}"
      RESOLVER_NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      RESOLVER_NEO4J_PASSWORD_FILE: "/run/sunaq-secrets/neo4j_auth"
      RESOLVER_NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ../../runtime/service-secrets/neo4j_auth:/run/sunaq-secrets/neo4j_auth:ro
