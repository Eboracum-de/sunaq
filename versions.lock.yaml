notes:
- Registry images listed in the Compose lock set are digest-pinned; Compose tags are retained
  only for readability. The locally built Playwright renderer currently uses the tag-pinned
  Microsoft Playwright base image v1.62.0-noble; base-image digest pinning is deferred hardening.
- Ollama is no longer installed or managed by the middleware. LLM and embedding backends
  are administrator-managed external services.
- SearXNG/Valkey are not bundled; public web search providers are external administrator-managed
  services.
- Neo4j is intentionally pinned to the previously validated 5.26.29 image digest rather
  than following the mutable 5.26.29-community tag.
