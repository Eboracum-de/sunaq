id: sunaq-deep
name: Tief
order: 30
description: Breite Recherche mit einem 50-Dokument-Fenster und großem Antwortkontext; zusätzliche Retrieval-Runden folgen nach der Budget-Erprobung.

search:
  es_limit: 140
  vector_limit: 180
  vector_threshold: 0.50
  rrf_k: 60
  rerank_candidates: 50
  final_limit: 50
  rerank_min_score: null

retrieval_planner:
  enabled: true
  thinking: false
  max_retrieval_rounds: 1
  max_queries_per_round: 3
  model: ""
  max_tokens: 1200
  context_max_chars: 26000
  max_complete_documents: 50
  overflow_acl_scan_limit: 180
  verification_candidate_limit: 50
  bounded_verification_candidate_limit: 50
  exhaustive_verification_candidate_limit: 50
  verification_max_chars_per_document: 6000
  verification_max_tokens: 2200
  verification_batch_size: 5

evidence_control:
  mode: "off"

retrieval_signal:
  enabled: true
  reject_unspecific: true
  unspecific_signal_floor: 0.08
  min_curve_candidates: 8
  head_size: 3
  tail_fraction: 0.33
  small_field_signal: 0.35
  explicit_anchor_signal: 0.45
  dominance_ratio: 1.50
  dominance_margin: 0.10
  secondary_weight_floor: 0.20
  overlap_k: 10

entity_resolution:
  enabled: true
  fail_open: true
  retry_seconds: 30
  fuzzy: true
  fuzzy_threshold: 86.0
  fuzzy_max_candidates: 12
  fuzzy_expansion_min_similarity: 90.0

graph_retrieval:
  enabled: true
  limit: 60
  pair_weight: 0.65
  relation_weight: 0.90
  direct_relation_weight: 0.75
  single_entity_weight: 0.30
  hydrate_limit: 30
  snippet_chars: 4000

reranker:
  backend: "none"
  model: "BAAI/bge-reranker-v2-m3"
  device: "cpu"
  max_length: 512
  batch_size: 4
  tei_url: ""
  timeout_seconds: 30
  tei_batch_size: 32
  fallback_backend: "none"

context_enrichment:
  enabled: true
  head_chars: 4000
  window_chars: 3000
  max_windows: 4
  max_chars: 16000

answer_context:
  max_documents: 50
  max_chars_per_document: 6000
  max_total_chars: 200000

deployment_overrides:
  dockerized:
    retrieval_planner:
      verification_candidate_limit: 50
      bounded_verification_candidate_limit: 50
      exhaustive_verification_candidate_limit: 50

resolver_research:
  enabled: false
  direct_answer: false
  sources: []
  enrich_resolved: false
  include_holdings: false
  archive_supplied_documents: false
  persist_external_graph: false

roles: {}

prompts:
  query_rewriter: query_rewriter.txt
  planner: retrieval_planner.txt
  verifier: candidate_verifier.txt
  evidence: evidence_decision.txt
  answer: rag_answer.txt
