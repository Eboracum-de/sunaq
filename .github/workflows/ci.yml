name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q rag tests
      - name: Shell syntax check
        run: |
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
      - name: Generate release manifest
        run: python scripts/generate_manifest.py --output /tmp/MANIFEST.sha256
      - name: Upload generated release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: /tmp/MANIFEST.sha256
          retention-days: 1
      - name: Verify committed release manifest
        run: python scripts/generate_manifest.py --check
      - name: Tests
        run: python -m pytest -q
