# Public-web evidence arm. Search/fetch/relevance policy is global.
# Per-user enablement and Nextcloud archive destination are admin-managed in
# runtime/users.sqlite, keyed by the canonical (nextcloud_server,nextcloud_login).

enabled: false

search:
  provider: brave
  url: ""
  api_key_env: "WEB_SEARCH_API_KEY"
  max_results: 10
  timeout: 20
  verify_tls: true

fetch:
  timeout: 25
  verify_tls: true
  concurrency: 4
  max_redirects: 5
  max_bytes: 15000000
  max_text_chars: 300000
  user_agent: "SunaQ-WebEvidence/0.8.6"
  # Public-Web retrieval is restricted to normal Web ports by default.
  allowed_ports: [80, 443]
  # UNSAFE compatibility escape hatch for controlled lab networks only.
  # Keep false for normal ERG deployments; true permits RFC1918/loopback/link-local targets.
  allow_private: false

relevance:
  api_key_env: "WEB_LLM_API_KEY"
  verify_tls: true
  timeout: 180
  num_ctx: 16384
  num_predict: 800
  preview_chars: 4200
  min_score: 0.58
  max_sources: 5

archive:
  # Live web and web archiving are separate opt-in capabilities.
  enabled: false
  # No root here in multi-user beta mode: target_path is per canonical user.
  # An explicit archive.root is accepted only as a single-user compatibility fallback.
  exclude_from_internal_retrieval: true
  write_research_markdown: true
  write_text_snapshot: true
  write_raw_pdf: true
  write_raw_html: false
  write_fetch_log: true
  write_metadata_json: true
  write_rendered_pdf: true
  renderer:
    # Optional local helper. Keep disabled unless rag-playwright-renderer is installed.
    enabled: false
    background: true
    background_runs: 1
    url: "http://127.0.0.1:8090/render"
    timeout: 45
    verify_tls: true
    max_bytes: 52428800
    landscape: true
    prefer_css_page_size: false
    viewport:
      width: 1440
      height: 900
    # rc1.2 renders the already fetched HTML snapshot without browser network
    # access; persistent browser cookies/state are therefore intentionally off.
    persist_state: false
    cleanup:
      # Best-effort rendering cleanup. No site-specific bypass logic.
      cookie_consent: off
      dismiss_overlays: false
      remove_overlays: false
  timeout: 30
